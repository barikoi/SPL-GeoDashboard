version: '3.7'
services:
  spl_geodashboard:
    container_name: spl-geodashboard
    image: rilusmahmud/spl-geodashboard:${TAG}
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_BASE_URL=""
      - NEXT_PUBLIC_AUTOCOMPLETE_API_KEY=""
    ports:
      - "80:3000"